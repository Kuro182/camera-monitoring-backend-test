services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: camera_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d camera_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - camera-monitoring-postgres:/var/lib/postgresql/data

volumes:
  camera-monitoring-postgres:
